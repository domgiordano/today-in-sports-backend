name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lambdas:
        description: Comma-separated lambda folders to deploy. Empty rebuilds the layer and deploys all.
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-lambda-python.yml@v1
    with:
      app: today-in-sports
      python-version: '3.13'
      test-command: python -m pytest tests -q
      lambdas: ${{ inputs.lambdas }}
